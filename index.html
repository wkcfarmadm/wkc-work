<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WKC Work Tracker</title>
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <header class="topbar"><span class="brand">🍓 WKC Work Tracker</span></header>
  <main>
    <h1>Choose an app</h1>
    <a class="btn btn-work" style="text-decoration:none;text-align:center" href="buah/"><span class="icon">🍓</span>buah batang buang<small>worker app</small></a>
    <a class="btn btn-work" style="text-decoration:none;text-align:center" href="daun/"><span class="icon">🍃</span>daun buang · Anak tanam · pokok masuk<small>worker app</small></a>
    <a class="btn btn-work" style="text-decoration:none;text-align:center;border-color:#1d3f73;color:#1d3f73" href="admin/"><span class="icon">📊</span>Admin Dashboard<small>management</small></a>
    <p class="muted">Open the app you need, then install it: Android Chrome ⋮ → Install app · iPhone Safari Share → Add to Home Screen.</p>
  </main>
  <script>
    // Remove the old version 1 offline files from this address (v1 lived here).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { if (r.scope === new URL('./', location.href).href) r.unregister(); });
      });
    }
    if (window.caches) caches.keys().then(function (k) { k.forEach(function (n) { if (n.indexOf('wkc-v1') === 0) caches.delete(n); }); });
  </script>
</body>
</html>
